<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Updates | Innovexor</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://img.icons8.com/nolan/64/artificial-intelligence.png" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
    <a href="waitlist.html">Waitlist</a>
    <a href="updates.html">Updates</a>
    <a href="account.html">Account</a>
  </nav>

  <header class="hero">
    <div class="glass">
      <h1><i class="fas fa-microchip"></i> Tech Updates</h1>
      <p>Live AI and Tech News from the web</p>
    </div>
  </header>

  <section class="section">
    <div style="margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
      <input type="text" id="searchBox" placeholder="Search topics like 'AI' or 'robotics'">
      <select id="filterTag" onchange="fetchUpdates()" style="padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc;">
        <option value="">All Tech Updates</option>
        <option value="story">Stories</option>
        <option value="show_hn">Show HN</option>
        <option value="ask_hn">Ask HN</option>
      </select>
      <button onclick="fetchUpdates()">Search</button>
    </div>
    <div id="updates"></div>
  </section>

  <footer>
    <p>Powered by Hacker News API | Built by Innovexor Team</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
