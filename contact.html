<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Innovexor</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://img.icons8.com/nolan/64/artificial-intelligence.png" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
    <a href="waitlist.html">Waitlist</a>
    <a href="updates.html">Updates</a>
    <a href="account.html">Account</a>
  </nav>

  <header class="hero">
    <div class="glass">
      <h1><i class="fas fa-envelope"></i> Contact Us</h1>
      <p>We’d love to hear from you.</p>
    </div>
  </header>

  <form onsubmit="handleContactSubmit(event)">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Email" required>
    <textarea name="message" placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>

  <section class="section">
    <h2>Messages Sent By User</h2>
    <div style="margin-bottom: 20px; display: flex; gap: 10px; justify-content: center;">
      <input type="text" id="queryUserId" placeholder="User ID" style="padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
      <button onclick="fetchMessagesForUser()" style="padding: 10px 20px;">Fetch Messages</button>
    </div>
    <div id="messagesList" style="max-width: 600px; margin: 0 auto;"></div>
  </section>

  <footer>
    <p>© 2025 Innovexor | All rights reserved</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
